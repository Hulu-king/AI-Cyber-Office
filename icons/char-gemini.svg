<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- 图二 Gemini: 黑边像素四角星 + 顶紫/右黄/底蓝/左蓝紫渐变像素块 + 白色中心萌眼 -->
  <!-- 黑色像素星形外框 -->
  <rect x="15" y="2" width="2" height="3" fill="#000000"/>
  <rect x="13" y="5" width="2" height="3" fill="#000000"/>
  <rect x="17" y="5" width="2" height="3" fill="#000000"/>
  <rect x="11" y="8" width="2" height="3" fill="#000000"/>
  <rect x="19" y="8" width="2" height="3" fill="#000000"/>
  <rect x="8" y="11" width="3" height="2" fill="#000000"/>
  <rect x="21" y="11" width="3" height="2" fill="#000000"/>
  <rect x="5" y="13" width="3" height="2" fill="#000000"/>
  <rect x="24" y="13" width="3" height="2" fill="#000000"/>
  <rect x="2" y="15" width="3" height="2" fill="#000000"/>
  <rect x="27" y="15" width="3" height="2" fill="#000000"/>
  <rect x="5" y="17" width="3" height="2" fill="#000000"/>
  <rect x="24" y="17" width="3" height="2" fill="#000000"/>
  <rect x="8" y="19" width="3" height="2" fill="#000000"/>
  <rect x="21" y="19" width="3" height="2" fill="#000000"/>
  <rect x="11" y="21" width="2" height="3" fill="#000000"/>
  <rect x="19" y="21" width="2" height="3" fill="#000000"/>
  <rect x="13" y="24" width="2" height="3" fill="#000000"/>
  <rect x="17" y="24" width="2" height="3" fill="#000000"/>
  <rect x="15" y="27" width="2" height="3" fill="#000000"/>

  <!-- 内部白色中心区 -->
  <rect x="11" y="11" width="10" height="10" fill="#FFFFFF"/>
  <!-- 顶部粉紫渐变角 (#D946EF / #8E63F7) -->
  <rect x="15" y="5" width="2" height="3" fill="#D946EF"/>
  <rect x="13" y="8" width="6" height="3" fill="#C084FC"/>
  <!-- 右侧暖黄渐变角 (#FFEA75 / #F59E0B) -->
  <rect x="24" y="15" width="3" height="2" fill="#FBBF24"/>
  <rect x="21" y="13" width="3" height="6" fill="#FFEA75"/>
  <!-- 底部科技蓝渐变角 (#4285F4 / #60A5FA) -->
  <rect x="15" y="24" width="2" height="3" fill="#4285F4"/>
  <rect x="13" y="21" width="6" height="3" fill="#60A5FA"/>
  <!-- 左侧蓝紫渐变角 (#8E63F7 / #818CF8) -->
  <rect x="5" y="15" width="3" height="2" fill="#6366F1"/>
  <rect x="8" y="13" width="3" height="6" fill="#A5B4FC"/>

  <!-- 中心两颗黑色竖像素萌眼 -->
  <rect x="12" y="14" width="2" height="4" fill="#000000"/>
  <rect x="18" y="14" width="2" height="4" fill="#000000"/>
</svg>
