<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- 图三 CEO 形象像素化: 银灰背头 + 黑框眼镜 + 黑色立领拉链皮衣 + 双手叉腰 -->
  <!-- 银灰偏分蓬松背头 -->
  <rect x="9" y="2" width="14" height="3" fill="#D1D5DB"/>
  <rect x="7" y="4" width="18" height="4" fill="#9CA3AF"/>
  <rect x="10" y="3" width="10" height="2" fill="#F3F4F6"/>
  <rect x="6" y="7" width="3" height="5" fill="#6B7280"/>
  <rect x="23" y="7" width="3" height="5" fill="#6B7280"/>
  <!-- 暖棕肤色面部与耳朵 -->
  <rect x="8" y="7" width="16" height="11" fill="#D99B78"/>
  <rect x="6" y="11" width="2" height="4" fill="#C68663"/>
  <rect x="24" y="11" width="2" height="4" fill="#C68663"/>
  <!-- 眉毛 -->
  <rect x="10" y="8" width="4" height="1" fill="#4B5563"/>
  <rect x="18" y="8" width="4" height="1" fill="#4B5563"/>
  <!-- 标志性黑框眼镜 + 眼神高光 -->
  <rect x="8" y="10" width="16" height="1" fill="#111827"/>
  <rect x="9" y="10" width="6" height="4" fill="#111827"/>
  <rect x="17" y="10" width="6" height="4" fill="#111827"/>
  <rect x="10" y="11" width="4" height="2" fill="#FFFFFF"/>
  <rect x="18" y="11" width="4" height="2" fill="#FFFFFF"/>
  <rect x="11" y="11" width="2" height="2" fill="#451A03"/>
  <rect x="19" y="11" width="2" height="2" fill="#451A03"/>
  <!-- 鼻子与自信微笑嘴线 -->
  <rect x="15" y="13" width="2" height="2" fill="#B47555"/>
  <rect x="12" y="16" width="8" height="1" fill="#8C4A32"/>
  <!-- 黑色机车皮夹克 (立领 + 肩章垫肩 + 银色双拉链 + 黑色内搭T恤 + 叉腰双臂) -->
  <rect x="10" y="18" width="12" height="2" fill="#18181B"/>
  <rect x="6" y="20" width="20" height="9" fill="#18181B"/>
  <!-- 肩部皮衣纹理高光 -->
  <rect x="6" y="20" width="4" height="3" fill="#3F3F46"/>
  <rect x="22" y="20" width="4" height="3" fill="#3F3F46"/>
  <!-- 内搭黑色圆领衫 -->
  <rect x="13" y="19" width="6" height="9" fill="#09090B"/>
  <!-- 标志性银白金属立领拉链 -->
  <rect x="12" y="19" width="1" height="9" fill="#E4E4E7"/>
  <rect x="19" y="19" width="1" height="9" fill="#E4E4E7"/>
  <!-- 叉腰双臂与双手 -->
  <rect x="4" y="22" width="2" height="5" fill="#18181B"/>
  <rect x="26" y="22" width="2" height="5" fill="#18181B"/>
  <rect x="5" y="27" width="3" height="2" fill="#D99B78"/>
  <rect x="24" y="27" width="3" height="2" fill="#D99B78"/>
  <!-- 银色皮带扣 -->
  <rect x="14" y="28" width="4" height="2" fill="#D4D4D8"/>
  <rect x="15" y="28" width="2" height="2" fill="#18181B"/>
</svg>
