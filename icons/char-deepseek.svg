<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- 图二 DeepSeek: 像素亮蓝小鲸鱼 + 头顶喷水滴 + 条纹白肚皮 + 扬起双叶尾鳍 -->
  <!-- 头顶蓝色喷水柱 -->
  <rect x="12" y="3" width="2" height="2" fill="#4DA3FF"/>
  <rect x="17" y="3" width="2" height="2" fill="#4DA3FF"/>
  <rect x="14" y="5" width="3" height="2" fill="#0B63FF"/>
  <!-- 扬起的尾鳍与黑色像素外框 -->
  <rect x="23" y="10" width="7" height="2" fill="#000000"/>
  <rect x="24" y="12" width="5" height="3" fill="#0B63FF"/>
  <rect x="22" y="11" width="2" height="4" fill="#000000"/>
  <rect x="29" y="11" width="2" height="4" fill="#000000"/>
  <!-- 鲸鱼主躯干黑边 -->
  <rect x="7" y="10" width="12" height="2" fill="#000000"/>
  <rect x="5" y="12" width="2" height="3" fill="#000000"/>
  <rect x="3" y="15" width="2" height="8" fill="#000000"/>
  <rect x="5" y="23" width="2" height="3" fill="#000000"/>
  <rect x="7" y="26" width="16" height="2" fill="#000000"/>
  <rect x="23" y="22" width="3" height="4" fill="#000000"/>
  <rect x="25" y="15" width="2" height="7" fill="#000000"/>
  <rect x="19" y="12" width="5" height="3" fill="#000000"/>
  <!-- 鲸鱼亮蓝背部填充 -->
  <rect x="7" y="12" width="12" height="10" fill="#0B63FF"/>
  <rect x="5" y="15" width="14" height="7" fill="#0B63FF"/>
  <rect x="19" y="15" width="6" height="8" fill="#0B63FF"/>
  <rect x="8" y="12" width="9" height="3" fill="#4DA3FF"/>
  <!-- 白色肚皮与浅蓝条纹纹理 -->
  <rect x="5" y="20" width="13" height="4" fill="#FFFFFF"/>
  <rect x="7" y="24" width="14" height="2" fill="#FFFFFF"/>
  <rect x="7" y="22" width="2" height="4" fill="#D9EDFF"/>
  <rect x="11" y="22" width="2" height="4" fill="#D9EDFF"/>
  <rect x="15" y="23" width="2" height="3" fill="#D9EDFF"/>
  <!-- 黑色像素眼睛 + 高光 -->
  <rect x="10" y="16" width="3" height="3" fill="#000000"/>
  <rect x="10" y="16" width="1" height="1" fill="#FFFFFF"/>
  <!-- 侧边深蓝小胸鳍 -->
  <rect x="17" y="21" width="5" height="3" fill="#000000"/>
  <rect x="18" y="21" width="3" height="2" fill="#4DA3FF"/>
</svg>
