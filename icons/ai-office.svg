      <stop offset="0%" stop-color="#0B1021"/>
      <stop offset="100%" stop-color="#171E38"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Outer cyber badge -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.8"/>

  <!-- Subtle cyber grid -->
  <path d="M12 52 H52" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- Golden CEO Crown on roof -->
  <path d="M24 14 L27 19 L32 13 L37 19 L40 14 L39 21 H25 Z" fill="#FBBF24"/>
  <rect x="25" y="21" width="14" height="2.5" rx="1" fill="#F59E0B"/>

  <!-- Cyber Office Tower -->
  <rect x="16" y="24" width="32" height="28" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>

  <!-- 4 AI Department Glowing Pixel Windows -->
  <!-- Top-Left: DeepSeek Blue -->
  <rect x="20" y="28" width="10" height="8" rx="1.5" fill="#0EA5E9"/>
  <rect x="22" y="30" width="3" height="2" fill="#E0F2FE"/>

  <!-- Top-Right: ChatGPT Emerald -->
  <rect x="34" y="28" width="10" height="8" rx="1.5" fill="#10B981"/>
  <rect x="36" y="30" width="3" height="2" fill="#D1FAE5"/>

  <!-- Bottom-Left: Claude Orange -->
  <rect x="20" y="39" width="10" height="7" rx="1.5" fill="#F97316"/>
  <rect x="22" y="41" width="3" height="2" fill="#FFEDD5"/>

  <!-- Bottom-Right: Antigravity Purple -->
  <rect x="34" y="39" width="10" height="7" rx="1.5" fill="#A855F7"/>
  <rect x="36" y="41" width="3" height="2" fill="#F3E8FF"/>

  <!-- Central Lobby Entrance -->
