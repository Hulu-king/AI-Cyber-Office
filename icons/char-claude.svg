  <rect x="2" y="13" width="4" height="4" fill="#E07A53"/>
  <rect x="26" y="13" width="4" height="4" fill="#E07A53"/>
  <!-- 两颗深棕黑方形像素眼 (#7A3E00 / #1E1108) -->
  <rect x="9" y="12" width="3" height="3" fill="#23120B"/>
  <rect x="20" y="12" width="3" height="3" fill="#23120B"/>
  <!-- 底部 4 条垂直像素短腿 -->
  <rect x="7" y="22" width="3" height="6" fill="#E07A53"/>
  <rect x="12" y="22" width="3" height="6" fill="#E07A53"/>
  <rect x="17" y="22" width="3" height="6" fill="#E07A53"/>
  <rect x="22" y="22" width="3" height="6" fill="#E07A53"/>
