name: "Build & Release Cross-Platform Desktop Dock"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # macOS x86 & Apple Silicon
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04' # Linux deb & AppImage
            args: ''
          - platform: 'windows-latest' # Windows .exe / .msi
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'AI Cyber Office v__VERSION__'
          releaseBody: '跨平台 AI 赛博办公室桌面挂件自动构建发布 (Windows / macOS / Linux)'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
